<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Validades — Estoque Fácil</title>
  <link rel="stylesheet" href="css/mobile.css"/>
  <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="css/design-system.css"/>
  <link rel="stylesheet" href="css/toast.css"/>
  <style>
    .filtro-dias {
      display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .filtro-dias select {
      padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text-primary); font-family: var(--font);
    }
    .validade-linha {
      display: grid; grid-template-columns: 1fr 110px 130px 140px;
      gap: 12px; align-items: center; padding: 12px 16px;
      border-bottom: 1px solid var(--border); font-size: 13.5px;
    }
    .validade-linha:last-child { border-bottom: none; }
    .validade-linha .produto-nome { font-weight: 600; }
    .validade-linha .qtd { color: var(--text-muted); font-size: 12.5px; }
    @media (max-width: 700px) {
      .validade-linha { grid-template-columns: 1fr; gap: 4px; padding: 12px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg class="logo-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="15" height="8" rx="2" fill="#1677FF"/>
        <rect x="2" y="14" width="15" height="8" rx="2" fill="#1677FF" opacity="0.7"/>
        <rect x="10" y="14" width="15" height="8" rx="2" fill="#00C48C"/>
        <rect x="2" y="26" width="22" height="8" rx="2" fill="#00C48C"/>
      </svg>
      <div class="logo-text">
        <div class="logo-name"><span class="white">Estoque</span> <span class="green">Fácil</span></div>
        <div class="logo-tag">SaaS</div>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Menu</div>
      <a href="dashboard.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="produtos.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        Produtos
      </a>
      <a href="movimentacoes.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        Movimentações
      </a>
      <a href="historico.html" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Histórico
      </a>
      <a href="validades.html" class="nav-link active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Validades
      </a>
    </div>

    <div class="sidebar-footer">
      <button class="nav-link" id="btnLogout" style="width:100%;border:none;background:none;cursor:pointer;text-align:left;font-family:inherit;font-size:13.5px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="page-title">Validades</span>
        <span class="breadcrumb">/ Controle de vencimento por lote</span>
      </div>
      <div class="topbar-right">
        <div class="user-avatar" id="avatarUser">?</div>
      </div>
    </header>

    <div class="content">
      <div class="filtro-dias">
        <label class="form-label" style="margin:0">Mostrar vencimentos até:</label>
        <select id="filtroDias">
          <option value="7">7 dias</option>
          <option value="15">15 dias</option>
          <option value="30">30 dias</option>
        </select>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-title">Lotes vencidos ou vencendo</span></div>
        <div id="listaValidades"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/toast.js"></script>
<script src="js/unidades.js"></script>
<script src="js/validades.js"></script>
<script src="js/admin-btn.js"></script>
<script>
  const nome = localStorage.getItem('nome') || JSON.parse(localStorage.getItem('user') || '{}').nome || '?';
  document.getElementById('avatarUser').textContent = nome.charAt(0).toUpperCase();
  document.getElementById('btnLogout').addEventListener('click', function(){
    localStorage.clear(); location.href = 'index.html';
  });
</script>
<script src="js/gerente-btn.js"></script>
<script src="js/mobile-menu.js"></script>
<script src="js/mobile-enhancements.js"></script>
</body>
</html>
